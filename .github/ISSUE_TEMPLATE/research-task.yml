name: Research task
description: Propose a bounded evidence-gathering task
title: "Research: "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: State the Honda-specific question to answer.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and sources
      description: List local artifacts and external sources. Keep evidence classes explicit.
    validations:
      required: true
  - type: textarea
    id: evidence_classes
    attributes:
      label: Acceptable evidence classes
      description: Name which classes can answer this question, such as Honda evidence or external prior art.
    validations:
      required: true
  - type: textarea
    id: bounds
    attributes:
      label: Scope and stop condition
      description: Define scope, exclusions, stop conditions, and what result closes the task.
    validations:
      required: true
