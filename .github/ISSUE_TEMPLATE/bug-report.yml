name: Bug report
description: Report a reproducible offline model, tool, or documentation defect
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include a minimal command or synthetic test case. Do not attach private captures or firmware.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: dropdown
    id: vehicle
    attributes:
      label: Vehicle interaction
      options:
        - NONE — offline only
        - READ-ONLY
        - REVERSIBLE TEST
        - LIVE MUTATION
    validations:
      required: true
