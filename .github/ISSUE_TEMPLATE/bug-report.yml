name: Bug report
description: Report a reproducible offline model, tool, or documentation defect
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include a minimal command or synthetic test case. Do not attach private captures or firmware.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, relevant version/commit, and tool versions. Omit vehicle identifiers.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove credentials, personal data, endpoints, MAC addresses, and private captures. Do not attach firmware or raw vehicle data.
    validations:
      required: false
  - type: dropdown
    id: vehicle
    attributes:
      label: Vehicle interaction
      description: Did the reproduction involve vehicle access?
      options:
        - NONE — offline only
        - READ-ONLY
        - REVERSIBLE TEST
        - LIVE MUTATION
    validations:
      required: true
