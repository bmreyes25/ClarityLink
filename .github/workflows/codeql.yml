name: CodeQL

on:
  push:
    branches: [main, architecture/r6d-static-auth-closure]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 3"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: manual
          - language: java-kotlin
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build native transaction core for analysis
        if: matrix.language == 'c-cpp'
        run: |
          clang -std=c11 -Wall -Wextra -Werror -O1 -g -pthread \
            -I src/claritylink-negotiation \
            src/claritylink-negotiation/native_setup_txn.c \
            tests/native/native_setup_txn_host.c \
            -o /tmp/native-setup-txn
          /tmp/native-setup-txn
      - uses: github/codeql-action/analyze@v4
