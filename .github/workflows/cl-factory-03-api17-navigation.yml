name: CL-FACTORY-03 API 17 structured navigation

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/cl-factory-03-api17-structured-navigation]

permissions:
  contents: read

concurrency:
  group: cl-factory-03-api17-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  api17-navigation:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install fixed Java toolchain
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # setup-java v6.1.0
        with:
          distribution: temurin
          java-version: '17.0.12+7'

      - name: Install Android SDK command line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Verify and install pinned API 17 build inputs
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME" -type f -path '*/bin/sdkmanager' -print -quit)"
          "$sdkmanager" --list --include_obsolete | tee sdk-package-query.txt
          for package in 'build-tools;35.0.0' 'emulator' 'system-images;android-17;default;x86'; do
            grep -F -q "$package" sdk-package-query.txt || { echo "MISSING_PACKAGE=$package"; exit 20; }
          done
          packages=('platform-tools' 'build-tools;35.0.0' 'system-images;android-17;default;x86')
          if grep -F -q 'platforms;android-17' sdk-package-query.txt; then
            packages+=('platforms;android-17')
          else
            echo 'API17_PLATFORM_PACKAGE_NOT_LISTED; using verified Google archive.' | tee -a sdk-package-query.txt
          fi
          "$sdkmanager" --install "${packages[@]}"
          if [[ ! -f "$ANDROID_HOME/platforms/android-17/android.jar" ]]; then
            archive="$RUNNER_TEMP/android-17_r03.zip"
            curl --fail --location --silent --show-error 'https://dl.google.com/android/repository/android-17_r03.zip' -o "$archive"
            test "$(stat -c %s "$archive")" = 57030216
            echo 'b66e73fb2639f8c916fde4369aa29012a5c531e156dbb205fe3788fe998fbbe8  '"$archive" | sha256sum --check
            unzip -q "$archive" -d "$RUNNER_TEMP/android-17-platform"
            platform_source="$RUNNER_TEMP/android-17-platform/android-4.2.2"
            test -f "$platform_source/android.jar"
            grep -F -q 'AndroidVersion.ApiLevel=17' "$platform_source/source.properties"
            mkdir -p "$ANDROID_HOME/platforms/android-17"
            cp -a "$platform_source/." "$ANDROID_HOME/platforms/android-17/"
            sha256sum "$archive" "$ANDROID_HOME/platforms/android-17/android.jar" | tee api17-platform.sha256
          fi

      - name: Compile API 17 sources and run focused Java contracts
        shell: bash
        run: |
          set -euo pipefail
          java_home="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
          export JAVA_HOME="$java_home" ANDROID_HOME
          tools/test_r7c_java_api17.sh | tee api17-java-tests.txt
          CL_FACTORY_03_SDK_ROOT="$ANDROID_HOME" \
            CL_FACTORY_03_BUILD_DIR="$GITHUB_WORKSPACE/build/cl-r13-factory-03-navlab" \
            tools/build_cl_factory_03_api17_apk.sh | tee api17-apk-build.txt

      - name: Enable KVM on the hosted x86 runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test "$(uname -m)" = x86_64
          test -r /dev/kvm && test -w /dev/kvm

      - name: Execute structured navigation lifecycle on API 17 emulator
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 17
          system-image-api-level: 17
          target: default
          arch: x86
          profile: Nexus 5
          ram-size: 1024M
          heap-size: 128M
          disk-size: 2048M
          avd-name: cl-factory-03-api17-x86
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-linux-hw-accel: false
          script: tools/run_cl_factory_03_api17_ci.sh

      - name: Upload bounded runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cl-factory-03-api17-${{ github.run_id }}
          path: |
            sdk-package-query.txt
            api17-platform.sha256
            api17-java-tests.txt
            api17-apk-build.txt
            build/cl-factory-03-api17-receipt/
          if-no-files-found: ignore
          retention-days: 14
