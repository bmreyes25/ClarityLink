name: CL-R12 API 17 runtime recovery

on:
  workflow_dispatch:
    inputs:
      ab_mode:
        description: 'renderer = A/B renderer; workload = A/B performance Activity; pull requests outside those sources run one API17 runtime smoke'
        type: choice
        options: [renderer, workload]
        default: renderer
      baseline_ref:
        description: 'Baseline ref for the chosen mode (default: merge-base with origin/main)'
        required: false
        default: ''
  pull_request:
    paths:
      - '.github/workflows/cl-r12-api17-runtime-recovery.yml'
      - 'android/cl-imp-03-app/**'
      - 'android/src/main/java/**'
      - 'src/claritylink-renderer/android-api17/**'
      - 'tests/fixtures/cl-imp-08/**'
      - 'tools/build_cl_imp_03_apks.sh'
      - 'tools/run_cl_r12_messenger_lab_emulator.sh'
      - 'tools/run_cl_r12_api17_ci.sh'
      - 'tools/build_cl_r12_renderer_ab.sh'
      - 'tools/build_cl_r12_workload_ab.sh'
      - 'tools/check_cl_r12_perf_gate.py'
      - 'tools/summarize_cl_r12_ab.py'
      - 'tools/build_cl_honda_111_pane_test_apk.sh'
      - 'android/cl-honda-111-pane-test/**'
      - 'tools/build_cl_int_04_host_test_apk.sh'
      - 'android/cl-int-04-host-withdrawal-test/**'
      - 'android/src/test/java/org/claritylink/renderer/**'

permissions:
  contents: read

concurrency:
  group: cl-r12-api17-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api17-x86-runtime:
    name: Android 4.2.2 API 17 x86 runtime
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: ${{ github.workspace }}/.ci-android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.ci-android-sdk
      CL_IMP_03_SDK_ROOT: ${{ github.workspace }}/.ci-android-sdk
      CL_IMP_03_BUILD_DIR: ${{ github.workspace }}/build/cl-r12-api17-ci
      CL_R12_RECEIPT_DIR: ${{ github.workspace }}/build/cl-r12-api17-ci/receipt
      CL_R12_AB_REPEATS: '3'
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install fixed Java toolchain
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # setup-java v4
        with:
          distribution: temurin
          java-version: '17.0.12+7'

      - name: Install Android SDK command line tools in the isolated SDK root
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Locate command line tools and inspect available API 17 packages
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME" -type f -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          if [[ -z "$sdkmanager" ]]; then
            echo 'GitHub Ubuntu runner has no Android SDK command-line tools; installing official Google command-line tools is required.' | tee build-package-query.txt
            exit 2
          fi
          echo "sdkmanager=$sdkmanager" >> "$GITHUB_OUTPUT"
          "$sdkmanager" --list --include_obsolete | tee sdk-package-query.txt
          for package in 'build-tools;35.0.0' 'emulator' 'system-images;android-17;default;x86'; do
            if ! grep -F -q "$package" sdk-package-query.txt; then
              echo "MISSING_PACKAGE=$package" | tee -a sdk-package-query.txt
              exit 20
            fi
          done
          if grep -F -q 'platforms;android-17' sdk-package-query.txt; then
            echo 'api17_platform=listed' >> "$GITHUB_OUTPUT"
            echo 'API17_PLATFORM_PACKAGE_LISTED' | tee -a sdk-package-query.txt
          else
            echo 'api17_platform=archived' >> "$GITHUB_OUTPUT"
            echo 'API17_PLATFORM_PACKAGE_NOT_LISTED; use verified official Google archive android-17_r03.zip' | tee -a sdk-package-query.txt
          fi
          echo 'API17_PACKAGE_QUERY_PASS' | tee -a sdk-package-query.txt

      - name: Install API 17 platform, authentic x86 image, and build tools
        shell: bash
        run: |
          set -euo pipefail
          packages=('platform-tools' 'build-tools;35.0.0' 'system-images;android-17;default;x86')
          if [[ "${{ steps.sdk.outputs.api17_platform }}" == listed ]]; then
            packages+=('platforms;android-17')
          fi
          "${{ steps.sdk.outputs.sdkmanager }}" --install "${packages[@]}"

      - name: Install API 17 compile platform from the official Google archive
        if: steps.sdk.outputs.api17_platform == 'archived'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/android-17_r03.zip"
          url='https://dl.google.com/android/repository/android-17_r03.zip'
          curl --fail --location --silent --show-error "$url" -o "$archive"
          test "$(stat -c %s "$archive")" = 57030216
          echo 'b66e73fb2639f8c916fde4369aa29012a5c531e156dbb205fe3788fe998fbbe8  '"$archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/android-17-platform"
          platform_source="$RUNNER_TEMP/android-17-platform/android-4.2.2"
          test -f "$platform_source/android.jar"
          grep -F -q 'AndroidVersion.ApiLevel=17' "$platform_source/source.properties"
          mkdir -p "$ANDROID_HOME/platforms/android-17"
          cp -a "$platform_source/." "$ANDROID_HOME/platforms/android-17/"
          sha256sum "$archive" "$ANDROID_HOME/platforms/android-17/android.jar" | tee api17-platform.sha256

      - name: Select API 17 comparison mode
        id: ab-mode
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode='${{ inputs.ab_mode }}'
          else
            git fetch --no-tags origin main
            base="$(git merge-base HEAD origin/main)"
            if [ "$base" = "$(git rev-parse HEAD)" ]; then base="$(git rev-parse HEAD^)"; fi
            changed="$(git diff --name-only "$base"...HEAD)"
            has_activity=false
            has_renderer=false
            grep -Eq '(^|/)MessengerFramePerformanceActivity\.java$' <<<"$changed" && has_activity=true || true
            grep -Eq '^src/claritylink-renderer/android-api17/' <<<"$changed" && has_renderer=true || true
            other_build_inputs="$(grep -E '^(android/|tools/|src/|tests/fixtures/cl-imp-08/)' <<<"$changed" \
              | grep -Ev '^(src/claritylink-renderer/android-api17/|android/cl-imp-03-app/java/org/claritylink/android/MessengerFrame(PerformanceActivity|Parcel)\.java$)' || true)"
            if [ "$has_activity" = true ] && [ "$has_renderer" = false ]; then
              mode=workload
            elif [ "$has_renderer" = true ] && [ "$has_activity" = false ] && [ -z "$other_build_inputs" ]; then
              mode=renderer
            else
              mode=smoke
            fi
          fi
          case "$mode" in renderer|workload|smoke) ;; *) echo "Invalid comparison mode: $mode" >&2; exit 2 ;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Build the selected API 17 candidate APKs
        shell: bash
        run: |
          set -euo pipefail
          java_home="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
          export JAVA_HOME="$java_home"
          mode='${{ steps.ab-mode.outputs.mode }}'
          if [ "$mode" = smoke ]; then
            smoke_dir="$GITHUB_WORKSPACE/build/cl-r12-smoke-$GITHUB_RUN_ID"
            CL_IMP_03_BUILD_DIR="$smoke_dir" tools/build_cl_imp_03_apks.sh | tee build-output.txt
            candidate_apk="$smoke_dir/claritylink-display-lab.apk"
            {
              echo "ab_mode=smoke"
              echo "candidate_commit=$(git rev-parse HEAD)"
              echo 'baseline_commit=not_applicable'
              echo "candidate_apk_sha256=$(sha256sum "$candidate_apk" | awk '{print $1}')"
            } | tee source-ab.sha256
          else
            git fetch --no-tags origin main
            baseline_ref="$(git merge-base HEAD origin/main)"
            if [ "$baseline_ref" = "$(git rev-parse HEAD)" ]; then baseline_ref="$(git rev-parse HEAD^)"; fi
            ab_dir="$GITHUB_WORKSPACE/build/cl-r12-ab-$GITHUB_RUN_ID"
            if [ -n "${{ github.event.inputs.baseline_ref }}" ]; then baseline_ref="${{ github.event.inputs.baseline_ref }}"; fi
            if [ "$mode" = workload ]; then
              tools/build_cl_r12_workload_ab.sh "$baseline_ref" "$ab_dir" | tee build-output.txt
            else
              tools/build_cl_r12_renderer_ab.sh "$baseline_ref" "$ab_dir" | tee build-output.txt
            fi
            {
              echo "pull_request_head=${{ github.event.pull_request.head.sha }}"
              echo "pull_request_base=${{ github.event.pull_request.base.ref }}"
              echo "tested_merge_commit=$(git rev-parse HEAD)"
              cat "$ab_dir/ab-identity.txt"
            } | tee source-ab.sha256
            echo "CL_R12_BASELINE_APK=$ab_dir/baseline.apk" >> "$GITHUB_ENV"
            candidate_apk="$ab_dir/candidate.apk"
          fi
          echo "CL_R12_CANDIDATE_APK=$candidate_apk" >> "$GITHUB_ENV"
          mkdir -p "$CL_IMP_03_BUILD_DIR"
          cp "$candidate_apk" "$CL_IMP_03_BUILD_DIR/claritylink-display-lab.apk"
          if [ "$mode" = smoke ]; then
            sha256sum "$candidate_apk" | tee apk-candidate.sha256
          else
            sha256sum "$ab_dir/baseline.apk" "$candidate_apk" | tee apk-ab.sha256
          fi
          sha256sum build/cl-r12-api17-ci/claritylink-display-lab.apk | tee apk.sha256

      - name: Build the synthetic PaneLease instrumentation APK
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          pane_dir="$GITHUB_WORKSPACE/build/cl-pane-test-$GITHUB_RUN_ID"
          tools/build_cl_honda_111_pane_test_apk.sh "$pane_dir" | tee -a build-output.txt
          echo "CL_PANE_LEASE_TEST_APK=$pane_dir/claritylink-pane-lease-test.apk" >> "$GITHUB_ENV"
          sha256sum "$pane_dir/claritylink-pane-lease-test.apk" | tee pane-test-apk.sha256

      - name: Build the synthetic CL-INT-04 host-withdrawal instrumentation APK
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          host_dir="$GITHUB_WORKSPACE/build/cl-int-04-host-test-$GITHUB_RUN_ID"
          tools/build_cl_int_04_host_test_apk.sh "$host_dir" | tee -a build-output.txt
          echo "CL_INT_04_HOST_TEST_APK=$host_dir/claritylink-host-withdrawal-test.apk" >> "$GITHUB_ENV"
          sha256sum "$host_dir/claritylink-host-withdrawal-test.apk" | tee host-withdrawal-test-apk.sha256

      - name: Verify the classes inside the built DEX (not the source list)
        shell: bash
        run: |
          set -euo pipefail
          dexdump="$ANDROID_HOME/build-tools/35.0.0/dexdump"
          test -x "$dexdump"
          src="$(git rev-parse HEAD)"
          lab=(--require org.claritylink.renderer.PaneEvent --require org.claritylink.renderer.PaneLease
               --require org.claritylink.renderer.Display1OutputBackend --require org.claritylink.renderer.ClarityLinkContentView
               --require org.claritylink.android.SyntheticFrameFill --require org.claritylink.android.MessengerFramePerformanceActivity
               --require org.claritylink.android.MessengerFrameParcel
               --require-method org.claritylink.android.SyntheticFrameFill#fill
               --require-method org.claritylink.android.MessengerFrameParcel#read
               --require-method org.claritylink.renderer.Display1OutputBackend#setRendererViewport
               --require-method org.claritylink.renderer.ClarityLinkContentView#useSharedConverter)
          tests=(--require org.claritylink.renderer.PaneLease --require org.claritylink.renderer.PaneEvent
                 --require org.claritylink.renderer.Display1PaneLeaseLifecycleTest
                 --require org.claritylink.renderer.Display1RendererViewportInPlaceTest
                 --require org.claritylink.renderer.PaneLeaseFdLifecycleTest
                 --require org.claritylink.renderer.PaneLeaseTest
                 --require org.claritylink.android.SyntheticFrameFillTest)
          {
            echo "tested_merge_commit=$src"
            echo "pull_request_head=${{ github.event.pull_request.head.sha }}"
            python3 -I tools/verify_apk_dex_classes.py --apk "$CL_R12_CANDIDATE_APK" --dexdump "$dexdump" --label candidate-lab --source-commit "$src" "${lab[@]}"
            python3 -I tools/verify_apk_dex_classes.py --apk "$CL_PANE_LEASE_TEST_APK" --dexdump "$dexdump" --label pane-lease-test --source-commit "$src" "${tests[@]}"
            python3 -I tools/verify_apk_dex_classes.py --apk "$CL_INT_04_HOST_TEST_APK" --dexdump "$dexdump" --label host-withdrawal-test --source-commit "$src" \
              --require org.claritylink.renderer.Display1HostExpiryTest --require org.claritylink.renderer.ProducerDeathService \
              --require org.claritylink.renderer.Display1HostLeaseGuard --require org.claritylink.renderer.PaneLease
            if [ "${{ steps.ab-mode.outputs.mode }}" = "workload" ]; then
              python3 -I tools/verify_apk_dex_classes.py --apk "$CL_R12_BASELINE_APK" --dexdump "$dexdump" --label baseline-lab --source-commit "$src" "${lab[@]}"
            elif [ "${{ steps.ab-mode.outputs.mode }}" = "renderer" ]; then
              # Renderer A/B: the baseline TREE decides what the lease classes must look like. A baseline that
              # predates PaneLease must not contain them; a baseline that already has them (any PR branched
              # from a main that includes PaneLease) must, so both APKs carry the same lease code.
              # The candidate's workload helper (overlaid into the baseline) must be present either way.
              baseline_commit="$(sed -n 's/^baseline_commit=//p' "$(dirname "$CL_R12_BASELINE_APK")/ab-identity.txt")"
              test -n "$baseline_commit"
              if git cat-file -e "$baseline_commit:src/claritylink-renderer/android-api17/PaneLease.java" 2>/dev/null; then
                lease_expectation=(--require org.claritylink.renderer.PaneLease --require org.claritylink.renderer.PaneEvent)
              else
                lease_expectation=(--forbid org.claritylink.renderer.PaneLease --forbid org.claritylink.renderer.PaneEvent)
              fi
              python3 -I tools/verify_apk_dex_classes.py --apk "$CL_R12_BASELINE_APK" --dexdump "$dexdump" --label baseline-lab --source-commit "$src" \
                "${lease_expectation[@]}" \
                --require org.claritylink.android.SyntheticFrameFill --require org.claritylink.android.MessengerFramePerformanceActivity
            else
              echo 'baseline_dex_verification=not_applicable mode=smoke'
            fi
          } | tee dex-verification.txt

      - name: Enable KVM for the GitHub x86-64 runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          uname -m | tee kvm-host.txt
          nproc | tee -a kvm-host.txt
          free -h | tee -a kvm-host.txt
          df -h "$RUNNER_TEMP" | tee -a kvm-host.txt
          stat /dev/kvm | tee -a kvm-host.txt
          test "$(uname -m)" = x86_64
          test -r /dev/kvm && test -w /dev/kvm

      - name: Boot API 17 x86 and run the ClarityLink CL-R12 runtime scenario
        uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          api-level: 17
          system-image-api-level: 17
          target: default
          arch: x86
          profile: Nexus 5
          ram-size: 1024M
          heap-size: 128M
          disk-size: 2048M
          avd-name: cl-r12-api17-x86
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-linux-hw-accel: false
          script: ./tools/run_cl_r12_api17_ci.sh

      - name: Upload bounded runtime receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cl-r12-api17-runtime-receipt-${{ github.run_id }}
          path: |
            sdk-package-query.txt
            build-package-query.txt
            kvm-host.txt
            api17-platform.sha256
            build-output.txt
            apk.sha256
            apk-ab.sha256
            pane-test-apk.sha256
            host-withdrawal-test-apk.sha256
            source-ab.sha256
            dex-verification.txt
            build/cl-r12-api17-ci/receipt/
          if-no-files-found: ignore
          retention-days: 14
