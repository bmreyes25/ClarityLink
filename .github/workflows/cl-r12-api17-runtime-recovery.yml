name: CL-R12 API 17 runtime recovery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cl-r12-api17-runtime-recovery.yml'
      - 'android/cl-imp-03-app/**'
      - 'android/src/main/java/**'
      - 'src/claritylink-renderer/android-api17/**'
      - 'tests/fixtures/cl-imp-08/**'
      - 'tools/build_cl_imp_03_apks.sh'
      - 'tools/run_cl_r12_messenger_lab_emulator.sh'
      - 'tools/run_cl_r12_api17_ci.sh'

permissions:
  contents: read

concurrency:
  group: cl-r12-api17-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api17-x86-runtime:
    name: Android 4.2.2 API 17 x86 runtime
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: ${{ github.workspace }}/.ci-android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.ci-android-sdk
      CL_IMP_03_SDK_ROOT: ${{ github.workspace }}/.ci-android-sdk
      CL_IMP_03_BUILD_DIR: ${{ github.workspace }}/build/cl-r12-api17-ci
      CL_R12_RECEIPT_DIR: ${{ github.workspace }}/build/cl-r12-api17-ci/receipt
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install fixed Java toolchain
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # setup-java v4
        with:
          distribution: temurin
          java-version: '17.0.12+7'

      - name: Install Android SDK command line tools in the isolated SDK root
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Locate command line tools and inspect available API 17 packages
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME" -type f -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          if [[ -z "$sdkmanager" ]]; then
            echo 'GitHub Ubuntu runner has no Android SDK command-line tools; installing official Google command-line tools is required.' | tee build-package-query.txt
            exit 2
          fi
          echo "sdkmanager=$sdkmanager" >> "$GITHUB_OUTPUT"
          "$sdkmanager" --list --include_obsolete | tee sdk-package-query.txt
          for package in 'build-tools;35.0.0' 'emulator' 'system-images;android-17;default;x86'; do
            if ! grep -F -q "$package" sdk-package-query.txt; then
              echo "MISSING_PACKAGE=$package" | tee -a sdk-package-query.txt
              exit 20
            fi
          done
          if grep -F -q 'platforms;android-17' sdk-package-query.txt; then
            echo 'api17_platform=listed' >> "$GITHUB_OUTPUT"
            echo 'API17_PLATFORM_PACKAGE_LISTED' | tee -a sdk-package-query.txt
          else
            echo 'api17_platform=archived' >> "$GITHUB_OUTPUT"
            echo 'API17_PLATFORM_PACKAGE_NOT_LISTED; use verified official Google archive android-17_r03.zip' | tee -a sdk-package-query.txt
          fi
          echo 'API17_PACKAGE_QUERY_PASS' | tee -a sdk-package-query.txt

      - name: Install API 17 platform, authentic x86 image, and build tools
        shell: bash
        run: |
          set -euo pipefail
          packages=('platform-tools' 'build-tools;35.0.0' 'system-images;android-17;default;x86')
          if [[ "${{ steps.sdk.outputs.api17_platform }}" == listed ]]; then
            packages+=('platforms;android-17')
          fi
          "${{ steps.sdk.outputs.sdkmanager }}" --install "${packages[@]}"

      - name: Install API 17 compile platform from the official Google archive
        if: steps.sdk.outputs.api17_platform == 'archived'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/android-17_r03.zip"
          url='https://dl.google.com/android/repository/android-17_r03.zip'
          curl --fail --location --silent --show-error "$url" -o "$archive"
          test "$(stat -c %s "$archive")" = 57030216
          echo 'b66e73fb2639f8c916fde4369aa29012a5c531e156dbb205fe3788fe998fbbe8  '"$archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/android-17-platform"
          platform_source="$RUNNER_TEMP/android-17-platform/android-4.2.2"
          test -f "$platform_source/android.jar"
          grep -F -q 'AndroidVersion.ApiLevel=17' "$platform_source/source.properties"
          mkdir -p "$ANDROID_HOME/platforms/android-17"
          cp -a "$platform_source/." "$ANDROID_HOME/platforms/android-17/"
          sha256sum "$archive" "$ANDROID_HOME/platforms/android-17/android.jar" | tee api17-platform.sha256

      - name: Build fresh synthetic ClarityLink APKs
        shell: bash
        run: |
          set -euo pipefail
          java_home="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
          export JAVA_HOME="$java_home"
          source_file='android/cl-imp-03-app/java/org/claritylink/android/MessengerFramePerformanceActivity.java'
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            baseline_ref='${{ github.event.pull_request.head.sha }}^'
          else
            baseline_ref='HEAD^'
          fi
          git show "$baseline_ref:$source_file" > "$RUNNER_TEMP/MessengerFramePerformanceActivity.baseline.java"
          cp "$RUNNER_TEMP/MessengerFramePerformanceActivity.baseline.java" "$source_file"
          CL_IMP_03_BUILD_DIR="$RUNNER_TEMP/cl-r12-baseline-build" \
            "$GITHUB_WORKSPACE/tools/build_cl_imp_03_apks.sh" | tee build-output.txt
          cp "$RUNNER_TEMP/cl-r12-baseline-build/claritylink-display-lab.apk" "$RUNNER_TEMP/cl-r12-baseline.apk"
          git checkout HEAD -- "$source_file"
          CL_IMP_03_BUILD_DIR="$RUNNER_TEMP/cl-r12-optimized-build" \
            "$GITHUB_WORKSPACE/tools/build_cl_imp_03_apks.sh" | tee -a build-output.txt
          cp "$RUNNER_TEMP/cl-r12-optimized-build/claritylink-display-lab.apk" "$RUNNER_TEMP/cl-r12-optimized.apk"
          echo "CL_R12_BASELINE_APK=$RUNNER_TEMP/cl-r12-baseline.apk" >> "$GITHUB_ENV"
          echo "CL_R12_CANDIDATE_APK=$RUNNER_TEMP/cl-r12-optimized.apk" >> "$GITHUB_ENV"
          mkdir -p "$CL_IMP_03_BUILD_DIR"
          cp "$RUNNER_TEMP/cl-r12-optimized.apk" "$CL_IMP_03_BUILD_DIR/claritylink-display-lab.apk"
          sha256sum "$RUNNER_TEMP/cl-r12-baseline.apk" "$RUNNER_TEMP/cl-r12-optimized.apk" | tee apk-ab.sha256
          sha256sum build/cl-r12-api17-ci/claritylink-display-lab.apk | tee apk.sha256

      - name: Enable KVM for the GitHub x86-64 runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          uname -m | tee kvm-host.txt
          nproc | tee -a kvm-host.txt
          free -h | tee -a kvm-host.txt
          df -h "$RUNNER_TEMP" | tee -a kvm-host.txt
          stat /dev/kvm | tee -a kvm-host.txt
          test "$(uname -m)" = x86_64
          test -r /dev/kvm && test -w /dev/kvm

      - name: Boot API 17 x86 and run the ClarityLink CL-R12 runtime scenario
        uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          api-level: 17
          system-image-api-level: 17
          target: default
          arch: x86
          profile: Nexus 5
          ram-size: 1024M
          heap-size: 128M
          disk-size: 2048M
          avd-name: cl-r12-api17-x86
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-linux-hw-accel: false
          script: ./tools/run_cl_r12_api17_ci.sh

      - name: Upload bounded runtime receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cl-r12-api17-runtime-receipt-${{ github.run_id }}
          path: |
            sdk-package-query.txt
            build-package-query.txt
            kvm-host.txt
            api17-platform.sha256
            build-output.txt
            apk.sha256
            apk-ab.sha256
            build/cl-r12-api17-ci/receipt/
          if-no-files-found: ignore
          retention-days: 14
